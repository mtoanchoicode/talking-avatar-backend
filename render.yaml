services:
  - type: web
    name: avatar-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120 --workers 1 --threads 4 --bind 0.0.0.0:10000
    envVars:
      - key: ${OPENAI_API_KEY}
        sync: false
      - key: ${PINECONE_API_KEY}
        sync: false
